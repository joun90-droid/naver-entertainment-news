<body>

  <div class="toast-notification" id="toastNotify">
    <span>✨</span>
    <span id="toastMsg">네이버 최신 연예뉴스가 실시간 자동 연동되었습니다!</span>

  <div class="user-greeting-card">

      <div class="sync-status-box">
        <span>자동 갱신:</span>
        <select class="auto-refresh-select" id="refreshIntervalSelect" aria-label="자동 갱신 간격">
          <option value="10">10초</option>
          <option value="15" selected>15초</option>
          <option value="30">30초</option>
          <option value="0">끄기</option>
        </select>
        <span id="countdownText" style="font-weight: bold; color: #4ade80;">(15초 후 갱신)</span>
      </div>
    </div>
    <div class="sync-progress-bg">
      <div class="sync-progress-bar" id="syncProgressBar"></div>
    </div>
  </div>

  <!-- AD_SLOT: top -->
  <div class="ad-slot" aria-label="광고">
    <span class="ad-slot-label">Advertisement</span>
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-pub-3079797618341925"
         data-ad-slot="0000000000"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
  </div>

  <div class="category-wrapper">
    <div class="category-chips" id="chipContainer">
      <button class="chip-btn active" data-category="실시간 랭킹" type="button">🔥 실시간 랭킹</button>
      <button class="chip-btn" data-category="연예가 핫토픽" type="button">💥 연예가 핫토픽</button>
      <button class="chip-btn" data-category="방송·TV" type="button">📺 방송·TV</button>
      <button class="chip-btn" data-category="영화" type="button">🎬 영화</button>
      <button class="chip-btn" data-category="드라마" type="button">🎭 드라마</button>
      <button class="chip-btn" data-category="뮤직" type="button">🎶 뮤직</button>
      <button class="chip-btn" data-category="해외연예" type="button">🌐 해외연예</button>
      <button class="chip-btn" data-category="⭐ 즐겨찾기" type="button">⭐ 즐겨찾기</button>
    </div>
  </div>

  <div class="search-container">
    <div class="search-box">
      <span>🔍</span>
      <input type="text" id="searchInput" placeholder="키워드·연예인·언론사 검색..." autocomplete="off">
    </div>
  </div>

  <main class="main-container">
    <section class="news-feed" id="newsFeed"></section>

    <aside class="inspector-panel" id="desktopInspector">
      <div style="font-size:0.85rem; font-weight:700; color:#f472b6; margin-bottom:12px;">📌 기사 상세 정보</div>
      <div id="inspectorContent">
        <div style="text-align:center; padding:50px 0; color:#64748b;">
          목록에서 기사를 선택하시면 상세 요약과 원본 링크를 확인하실 수 있습니다.
        </div>
      </div>
    </aside>
  </main>

  <!-- AD_SLOT: bottom -->

    <span class="ad-slot-label">Advertisement</span>
    <ins class="adsbygoogle"
         style="display:block"
