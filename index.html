<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">
  <title>전영재의 연예뉴스 핫토픽</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="https://ssl.pstatic.net/static/entertain/2025/m/09/18/favicon_enter_192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- App Sticky Header -->
  <header class="app-header">
    <div class="header-top">
      <div class="app-title">
        <span>🎬</span>
        <span>전영재의 연예뉴스 핫토픽</span>
      </div>
      <div class="header-actions">
        <div class="user-badge" id="liveStatusBadge" style="background: rgba(34, 197, 94, 0.2); border-color: rgba(34, 197, 94, 0.4); color: #4ade80;">🔴 LIVE 실시간</div>
        <div class="user-badge">👑 VIP 전영재</div>
        <button class="btn-icon" id="btnRefresh" title="새로고침">🔄</button>
      </div>
    </div>
  </header>

  <!-- User Greeting Card -->
  <div class="user-greeting-card">
    <div class="greeting-text">
      👋 <strong>전영재님</strong>, 네이버 연예계 실시간 최신 핫이슈를 확인하세요!
    </div>
  </div>

  <!-- Horizontal Swipeable Category Chips -->
  <div class="category-wrapper">
    <div class="category-chips" id="chipContainer">
      <button class="chip-btn active" data-category="실시간 랭킹">🔥 실시간 랭킹</button>
      <button class="chip-btn" data-category="연예가 핫토픽">💥 연예가 핫토픽</button>
      <button class="chip-btn" data-category="방송·TV">📺 방송·TV</button>
      <button class="chip-btn" data-category="영화">🎬 영화</button>
      <button class="chip-btn" data-category="드라마">🎭 드라마</button>
      <button class="chip-btn" data-category="뮤직">🎶 뮤직</button>
      <button class="chip-btn" data-category="해외연예">🌐 해외연예</button>
      <button class="chip-btn" data-category="⭐ 즐겨찾기">⭐ 즐겨찾기</button>
    </div>
  </div>

  <!-- Real-time Search Bar -->
  <div class="search-container">
    <div class="search-box">
      <span>🔍</span>
      <input type="text" id="searchInput" placeholder="전영재님, 키워드나 연예인/언론사를 검색해보세요...">
    </div>
  </div>

  <!-- Main Feed & Inspector Section -->
  <main class="main-container">
    <!-- News Feed List -->
    <section class="news-feed" id="newsFeed">
      <!-- Dynamically rendered by JS -->
    </section>

    <!-- Desktop Side Inspector -->
    <aside class="inspector-panel" id="desktopInspector">
      <div style="font-size:0.85rem; font-weight:700; color:#f472b6; margin-bottom:12px;">📌 기사 상세 정보</div>
      <div id="inspectorContent">
        <div style="text-align:center; padding:50px 0; color:#64748b;">
          목록에서 기사를 선택하시면 상세 요약과 원본 링크를 확인하실 수 있습니다.
        </div>
      </div>
    </aside>
  </main>

  <!-- Mobile Bottom Sheet Modal -->
  <div class="modal-overlay" id="modalOverlay"></div>
  <div class="modal-bottom-sheet" id="bottomSheet">
    <div class="sheet-handle"></div>
    <div id="sheetBody"></div>
  </div>

  <!-- Mobile App Bottom Navigation Bar -->
  <nav class="mobile-bottom-nav">
    <a href="#" class="nav-item active" data-category="실시간 랭킹">
      <span class="icon">🔥</span>
      <span>랭킹</span>
    </a>
    <a href="#" class="nav-item" data-category="연예가 핫토픽">
      <span class="icon">💥</span>
      <span>핫토픽</span>
    </a>
    <a href="#" class="nav-item" data-category="방송·TV">
      <span class="icon">📺</span>
      <span>방송/TV</span>
    </a>
    <a href="#" class="nav-item" data-category="영화">
      <span class="icon">🎬</span>
      <span>영화</span>
    </a>
    <a href="#" class="nav-item" data-category="⭐ 즐겨찾기">
      <span class="icon">⭐</span>
      <span>북마크</span>
    </a>
  </nav>

  <script src="news_cache.js"></script>
  <script src="app.js"></script>
</body>
</html>
